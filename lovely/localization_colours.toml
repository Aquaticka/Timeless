
[manifest]
version = "1.0.0"
dump_lua = true
priority = 5


# localization colour patch
[[patches]]
[patches.pattern]
target = "functions/misc_functions.lua"
pattern = "red = G.C.RED,"
position = "before"
payload = '''

-- Abyss localization colours
mystic = ABYSS_CONST.COLOUR.Mystic1,
tourmaline = ABYSS_CONST.COLOUR.Tourmaline,
opal = ABYSS_CONST.COLOUR.Opal,
spectrum = ABYSS_CONST.COLOUR.Spectrum,
uncommon = G.C.RARITY[2],
rare = G.C.RARITY[3],

'''
match_indent = true

# Shifting Onyx colour
[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "self.C.DARK_EDITION[2] = math.min(self.C.DARK_EDITION[3], self.C.DARK_EDITION[1])"
position = "after"
payload = '''

ABYSS_CONST.COLOUR.Opal[1] = 0.85+0.08*math.sin((self.TIMERS.REAL))
ABYSS_CONST.COLOUR.Opal[2] = 0.85+0.08*math.sin((self.TIMERS.REAL + (3.14 * 2)/3))
ABYSS_CONST.COLOUR.Opal[3] = 0.85+0.08*math.sin((self.TIMERS.REAL + (3.14 * 4)/3))

ABYSS_CONST.COLOUR.Spectrum[1] = 0.5+0.5*math.sin((self.TIMERS.REAL/4))
ABYSS_CONST.COLOUR.Spectrum[2] = 0.5+0.5*math.sin((self.TIMERS.REAL/4 + (3.14 * 1.5)/3))
ABYSS_CONST.COLOUR.Spectrum[3] = 0.5+0.5*math.sin((self.TIMERS.REAL/4 + (3.14 * 4)/3))

'''
match_indent = true
